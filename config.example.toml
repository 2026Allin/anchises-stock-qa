[database]
url = "mysql+pymysql://readonly_user:password@127.0.0.1:3306/Stocks_Tracker?charset=utf8mb4"
access_mode = "readonly"

[outputs]
dir = "~/.local/share/anchises-stock-qa/outputs"
cleanup_enabled = true
cleanup_interval_days = 7
retention_days = 30

[prompts]
override_dir = ""

[exchanges.aliases]
# Optional natural-language aliases for exchange codes discovered from table names.
# Example:
# "London" = "lse"
# "伦敦" = "lse"
