[backend]
mode = "remote_api"
api_base_url = "https://anchisesdata.com/anchises-stock-qa"
api_token = "paste_your_api_token_here"

[database]
url = ""
access_mode = "readonly"

[outputs]
dir = "~/.local/share/anchises-stock-qa/outputs"
cleanup_enabled = true
cleanup_interval_days = 7
retention_days = 30

[prompts]
override_dir = ""

[exchanges.aliases]
# Optional natural-language aliases for exchange codes discovered from table names.
# Example:
# "London" = "lse"
# "伦敦" = "lse"
